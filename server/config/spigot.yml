# Only the settings this project changes. Spigot fills in the rest with defaults.
world-settings:
  default:
    # Chunks around a player where mobs can spawn (default 8).
    mob-spawn-range: 4
    # Blocks from a player beyond which a mob stops running its full behavior.
    entity-activation-range:
      animals: 16
      monsters: 24
      raiders: 48
      misc: 8
      water: 8
      villagers: 16
      flying-monsters: 32
