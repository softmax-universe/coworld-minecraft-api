# Only the settings this project changes. Paper fills in the rest with defaults.
motd=Softmax minecraft-api | Minecraft 26.1.2 | /register on first join, then /login
server-port=25565
max-players=64
# Bots have no Mojang accounts. AuthMe's password login protects names instead.
online-mode=false
# Chat from clients without Mojang-signed keys must be accepted.
enforce-secure-profile=false
white-list=false
gamemode=survival
difficulty=normal
view-distance=8
simulation-distance=6
spawn-protection=0
# Admin console. The firewall on the EC2 box drops it from everything but localhost.
enable-rcon=true
rcon.port=25575
rcon.password=
broadcast-rcon-to-ops=false
